<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Console</title>
</head>
<body>
    <h1>Test Console</h1>
    <div id="app">
        <p>Nếu bạn thấy trang này, Vue đã load thành công!</p>
    </div>
    
    <script>
        console.log('Test console log');
        console.error('Test console error');
        
        // Test Vue component loading
        try {
            console.log('Testing Vue component...');
        } catch (error) {
            console.error('Vue component error:', error);
        }
    </script>
</body>
</html>
